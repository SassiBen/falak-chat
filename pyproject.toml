[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falak-chat"
version = "0.4.0"
description = "Assistant d'entreprise sur LLM local (Ollama), personnalisable par profil métier"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sassi Benalouache" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
finetune = ["torch", "transformers>=4.56", "peft>=0.12", "datasets>=2.20", "accelerate"]

[project.scripts]
falak = "falak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/falak"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
