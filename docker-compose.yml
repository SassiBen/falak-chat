services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    environment:
      # Le modèle reste en VRAM : le recharger coûte plus d'une minute sur 6 Go.
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build: .
    depends_on: [ollama]
    environment:
      - OLLAMA_URL=http://ollama:11434
      - FALAK_API_KEY=${FALAK_API_KEY:?définir FALAK_API_KEY dans .env}
      - FALAK_BASE_MODEL=${FALAK_BASE_MODEL:-qwen2.5:7b-instruct-q4_K_S}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ollama:
